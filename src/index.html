<!doctype html>
<html lang="en">
  <head>
    <!-- optional: it fixes hot-css reloading for nested pages -->
    <!-- now it's required: html-entry injects relative urls (like main.js) that must be resolved from root on nested pages -->
    <base href="/" />
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <!-- webpack skips relative urls placed after <base href="/">, so browser resolves them to /favicon.ico (copied from 'public' folder) -->
    <link rel="icon" href="favicon.ico" type="image/x-icon" />
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
    <title>webpack-must-have</title>

    <!-- optional: it clear console (for debug purpose) -->
    <!-- webpackIgnore: true -->
    <script>
      console.clear();
    </script>
    <!-- entryPoint: webpack compiles it and injects split chunks next to it; path is from project root because relative urls after <base> are skipped -->
    <script defer src="/src/main.tsx"></script>
    <!-- generated by WebpackObsoletePlugin (see webpack.common.js); relative url is skipped by webpack the same as favicon -->
    <script defer src="obsolete.js"></script>
  </head>

  <body>
    <noscript>
      <strong> We're sorry but this doesn't work properly without JavaScript enabled. Please enable it to continue. </strong>
    </noscript>
    <div id="app"></div>
    <!-- built files will be auto injected -->
  </body>
</html>
